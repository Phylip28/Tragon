[project]
name = "tragon-backend"
version = "0.1.0"
description = "Tragón backend — Django REST API for restaurant order automation"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.4,<6.0",
    "django-cors-headers>=4.6,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "boto3>=1.35,<2.0",
    "pillow>=11.0,<12.0",
    "gunicorn>=23.0,<24.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
