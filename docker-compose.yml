services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tragon
      POSTGRES_USER: tragon
      POSTGRES_PASSWORD: tragon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tragon"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./tragon_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: tragon
      POSTGRES_USER: tragon
      POSTGRES_PASSWORD: tragon
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: dev-secret-key-not-for-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tragon_backend:/app
      - /app/.venv

  frontend:
    build:
      context: ./tragon_frontend
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
